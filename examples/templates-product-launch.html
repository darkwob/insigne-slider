<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product launch · Insigne Slider</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/insigne-slider@1/dist/insigne-slider.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14161c;background:#fff}
html, body { height: 100%; }
  body { padding: 0; background: #0e0e0d; }
  insigne-slider { height: 100%; }
  .slide { background: radial-gradient(120% 90% at 70% 40%, #2a2925 0%, #0e0e0d 70%); }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #0e0e0d 0%, rgba(14,14,13,.6) 38%, transparent 70%); }
  .copy { position: absolute; left: clamp(20px, 6vw, 80px); top: 50%; transform: translateY(-50%); max-width: min(440px, 80%); color: #ece9e2; }
  .tag { font: 500 12px ui-monospace, Menlo, monospace; letter-spacing: .16em; text-transform: uppercase; color: #c9a35b; }
  h2 { font: 450 clamp(34px, 5.6vw, 72px)/.98 system-ui, sans-serif; letter-spacing: -.04em; margin: 14px 0 22px; }
  .specs { display: grid; grid-template-columns: repeat(3, auto); gap: 20px 28px; margin: 0; padding: 0; list-style: none; }
  .specs li { font: 13px/1.4 system-ui; color: rgba(236,233,226,.66); }
  .specs b { display: block; font: 500 22px system-ui; letter-spacing: -.02em; color: #ece9e2; }
</style>
</head>
<body>
<insigne-slider height="fill" effect="product" speed="1000" image-in="spotlight" autoplay="6500" pagination="progress" arrows="visible" arrows-position="bottom-right">
  <div class="slide">
    <img data-bg src="https://picsum.photos/id/250/1800/1200" alt="Vintage film camera" data-focus="62% 50%" data-safe="35 15 55 70">
    <div class="shade"></div>
    <div class="copy">
      <span class="tag" data-in="fade">New · Series 7</span>
      <h2 data-in="lines-up">Every frame, deliberate.</h2>
      <ul class="specs">
        <li data-in="rise"><b>45 MP</b>full frame</li>
        <li data-in="rise"><b>8 stops</b>stabilization</li>
        <li data-in="rise"><b>680 g</b>body only</li>
      </ul>
    </div>
  </div>
  <div class="slide">
    <img data-bg src="https://picsum.photos/id/119/1800/1200" alt="Laptop on a white desk" data-focus="55% 50%" data-safe="30 20 60 60">
    <div class="shade"></div>
    <div class="copy">
      <span class="tag" data-in="fade">New · Studio 14</span>
      <h2 data-in="lines-up">Quiet power, all day.</h2>
      <ul class="specs">
        <li data-in="rise"><b>22 h</b>battery</li>
        <li data-in="rise"><b>1.2 kg</b>aluminium</li>
        <li data-in="rise"><b>0 dB</b>fanless</li>
      </ul>
    </div>
  </div>
  <div class="slide">
    <img data-bg src="https://picsum.photos/id/160/1800/1200" alt="Smartphone on a table" data-focus="50% 50%" data-safe="30 25 45 55">
    <div class="shade"></div>
    <div class="copy">
      <span class="tag" data-in="fade">New · Pocket</span>
      <h2 data-in="lines-up">Small enough to forget.</h2>
      <ul class="specs">
        <li data-in="rise"><b>5.8″</b>display</li>
        <li data-in="rise"><b>162 g</b>weight</li>
        <li data-in="rise"><b>2 days</b>battery</li>
      </ul>
    </div>
  </div>
</insigne-slider>

</body>
</html>
