<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlays & particles · Insigne Slider</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/insigne-slider@1/dist/insigne-slider.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14161c;background:#fff}
body { padding: 0; }
  .wrap { position: relative; }
  .bar { position: absolute; z-index: 5; top: 12px; left: 12px; display: flex; gap: 8px; }
  select { font: 13px system-ui; padding: 6px 8px; border-radius: 8px; border: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <select id="o" aria-label="Overlay">
      <option>none</option><option selected>beams</option><option>rays</option><option>light-leak</option><option>grain</option>
      <option>letterbox</option><option>vignette</option><option>scanlines</option><option>fog</option>
    </select>
    <select id="p" aria-label="Particles">
      <option selected>none</option><option>stars</option><option>warp</option><option>dust</option><option>snow</option>
      <option>embers</option><option>bokeh</option><option>fireflies</option><option>bubbles</option>
    </select>
  </div>
  <div id="s">
    <div><img data-bg src="https://picsum.photos/id/1018/1600/1000" alt="Mountains"></div>
    <div><img data-bg src="https://picsum.photos/id/1015/1600/1000" alt="Fjord"></div>
  </div>
</div>
<script type="module">
const s = new InsigneSlider('#s', { overlay: 'beams', aspect: '16/9', autoplay: 5000 });
  const o = document.querySelector('#o');
  const p = document.querySelector('#p');
  o.onchange = p.onchange = () => s.update({ overlay: o.value, particles: p.value });
</script>
</body>
</html>
