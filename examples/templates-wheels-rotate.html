<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotate & spotlight · Insigne Slider</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/insigne-slider@1/dist/insigne-slider.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14161c;background:#fff}
html, body { height: 100%; }
  body { padding: 0; background: #111; }
  insigne-slider { height: 100%; --ins-arrow-bg: #f05a28; --ins-arrow-fg: #fff; }
  .shade { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(17,17,17,.9), rgba(17,17,17,0) 55%); }
  .copy { position: absolute; left: clamp(18px, 5vw, 64px); right: clamp(18px, 5vw, 64px); bottom: clamp(40px, 9%, 80px); display: flex; flex-wrap: wrap; gap: 18px 40px; align-items: end; justify-content: space-between; color: #fff; }
  h2 { margin: 0; font: 800 clamp(34px, 6vw, 80px)/.9 system-ui; letter-spacing: -.04em; text-transform: uppercase; }
  .model { font: 600 13px ui-monospace, Menlo, monospace; letter-spacing: .14em; color: #f05a28; text-transform: uppercase; }
  .price { font: 500 15px system-ui; color: rgba(255,255,255,.75); }
  .price b { display: block; font: 700 32px system-ui; color: #fff; letter-spacing: -.02em; }
</style>
</head>
<body>
<!-- "rotate" transition with a spotlight entrance on every photo: built for catalogs. -->
<insigne-slider height="fill" effect="rotate" speed="1000" image-in="spotlight" autoplay="5500" pagination="fraction" arrows="visible" arrows-position="top-right">
  <div>
    <img data-bg src="https://picsum.photos/id/514/2000/1300" alt="Off-road vehicle on a dirt road" data-focus="50% 55%" data-safe="20 30 60 55">
    <div class="shade"></div>
    <div class="copy"><div><span class="model" data-in="fade">Terrain AT · 17″</span><h2 data-in="chars-up">Go anywhere</h2></div><div class="price" data-in="rise">from<b>$249</b></div></div>
  </div>
  <div>
    <img data-bg src="https://picsum.photos/id/133/2000/1300" alt="Classic cars parked in a row" data-focus="50% 55%" data-safe="10 30 80 50">
    <div class="shade"></div>
    <div class="copy"><div><span class="model" data-in="fade">Classic WW · 15″</span><h2 data-in="chars-up">Born to cruise</h2></div><div class="price" data-in="rise">from<b>$189</b></div></div>
  </div>
  <div>
    <img data-bg src="https://picsum.photos/id/111/2000/1300" alt="Vintage car in a field" data-focus="50% 55%" data-safe="20 25 60 60">
    <div class="shade"></div>
    <div class="copy"><div><span class="model" data-in="fade">Heritage · 16″</span><h2 data-in="chars-up">Built to last</h2></div><div class="price" data-in="rise">from<b>$219</b></div></div>
  </div>
</insigne-slider>

</body>
</html>
