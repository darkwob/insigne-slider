<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Layers & typography · Insigne Slider</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/insigne-slider@1/dist/insigne-slider.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14161c;background:#fff}
body { padding: 0; }
  .copy { position: absolute; left: 7%; bottom: 14%; right: 7%; color: #fff; text-shadow: 0 2px 24px rgba(0,0,0,.4); }
  .copy small { font: 600 12px/1 system-ui; letter-spacing: .18em; text-transform: uppercase; opacity: .85; }
  .copy h2 { font-size: clamp(30px, 6vw, 62px); line-height: 1.02; letter-spacing: -.03em; margin: 12px 0; }
  .copy p { margin: 0 0 18px; max-width: 520px; opacity: .9; }
  .copy a { display: inline-block; background: #fff; color: #111; padding: 10px 18px; border-radius: 99px; text-decoration: none; font-weight: 600; text-shadow: none; }
</style>
</head>
<body>
<insigne-slider effect="fade" autoplay="6000" ken-burns="alternate">
  <div>
    <img data-bg src="https://picsum.photos/id/1039/1800/1100" alt="Waterfall in a forest">
    <div class="copy">
      <small data-in="fade">Chapter one</small>
      <h2 data-in="chars-up">Headlines letter by letter</h2>
      <p data-in="rise" data-delay="500">Paragraphs rise as a block, after the title.</p>
      <a href="#" data-in="rise" data-delay="700">Read more</a>
    </div>
  </div>
  <div>
    <img data-bg src="https://picsum.photos/id/1044/1800/1100" alt="Rocky coast">
    <div class="copy">
      <small data-in="fade">Chapter two</small>
      <h2 data-in="lines-up">Or line by line, revealed from a mask</h2>
      <p data-in="words-blur" data-split="words">Each word comes into focus on its own.</p>
    </div>
  </div>
</insigne-slider>

</body>
</html>
