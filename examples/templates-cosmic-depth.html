<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmic depth · Insigne Slider</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/insigne-slider@1/dist/insigne-slider.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14161c;background:#fff}
html, body { height: 100%; }
  body { padding: 0; background: #050506; }
  insigne-slider { height: 100%; }
  .copy { position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%); width: min(760px, 90%); text-align: center; color: #eef0f6; }
  .eyebrow { font: 500 12px ui-monospace, Menlo, monospace; letter-spacing: .3em; text-transform: uppercase; color: rgba(238,240,246,.7); }
  h2 { margin: 16px 0 0; font: 300 clamp(34px, 6.6vw, 84px)/1 system-ui, sans-serif; letter-spacing: -.03em; }
</style>
</head>
<body>
<!-- Star field particles, warp-speed WebGL between slides, letters converging with "tracking". -->
<insigne-slider height="fill" effect="warp-speed" speed="1500" particles="stars" particle-density="1.2" autoplay="6500" pagination="none" arrows="hover">
  <div>
    <img data-bg src="https://picsum.photos/id/903/2000/1300" alt="Milky Way over a dark horizon" data-focus="50% 40%">
    <div class="copy"><span class="eyebrow" data-in="fade">Chapter I</span><h2 data-in="tracking">Beyond the void</h2></div>
  </div>
  <div>
    <img data-bg src="https://picsum.photos/id/1022/2000/1300" alt="Green aurora over a forest" data-focus="50% 35%">
    <div class="copy"><span class="eyebrow" data-in="fade">Chapter II</span><h2 data-in="tracking">Light that travels</h2></div>
  </div>
  <div>
    <img data-bg src="https://picsum.photos/id/870/2000/1300" alt="Lighthouse at night" data-focus="50% 45%">
    <div class="copy"><span class="eyebrow" data-in="fade">Chapter III</span><h2 data-in="tracking">A signal home</h2></div>
  </div>
</insigne-slider>

</body>
</html>
