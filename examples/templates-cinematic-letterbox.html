<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinematic letterbox · Insigne Slider</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/insigne-slider@1/dist/insigne-slider.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14161c;background:#fff}
html, body { height: 100%; }
  body { padding: 0; background: #000; }
  insigne-slider { height: 100%; }
  .copy { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: #f5f3ee; padding: 0 6%; }
  h2 { margin: 0; font: 300 clamp(28px, 6vw, 76px)/1.05 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
  .sub { margin-top: 18px; font: 400 13px ui-monospace, Menlo, monospace; letter-spacing: .3em; text-transform: uppercase; color: rgba(245,243,238,.7); }
</style>
</head>
<body>
<!-- Full-screen zoom transitions, letterbox bars and wide-tracking titles. -->
<insigne-slider height="fill" effect="zoom" speed="1500" overlay="letterbox" ken-burns="zoom-in" ken-burns-scale="1.1" autoplay="7000" pagination="none" arrows="hover">
  <div>
    <img data-bg src="https://picsum.photos/id/1043/2000/1300" alt="Rainy city street at night" data-focus="50% 50%">
    <div class="copy"><h2 data-in="tracking">Stellar souls</h2><div class="sub" data-in="fade">A film in three parts</div></div>
  </div>
  <div>
    <img data-bg src="https://picsum.photos/id/1067/2000/1300" alt="City skyline at dusk" data-focus="50% 55%">
    <div class="copy"><h2 data-in="tracking">The long night</h2><div class="sub" data-in="fade">Part two</div></div>
  </div>
  <div>
    <img data-bg src="https://picsum.photos/id/1016/2000/1300" alt="Desert canyon" data-focus="50% 50%">
    <div class="copy"><h2 data-in="tracking">First light</h2><div class="sub" data-in="fade">Part three</div></div>
  </div>
</insigne-slider>

</body>
</html>
