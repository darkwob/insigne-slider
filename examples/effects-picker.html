<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All effects · Insigne Slider</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/insigne-slider@1/dist/insigne-slider.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14161c;background:#fff}
label { font: 14px system-ui; display: block; margin-bottom: 12px; }
  select { font: 14px system-ui; padding: 6px 10px; border-radius: 8px; margin-left: 6px; }
</style>
</head>
<body>
<label>Effect <select id="fx"></select></label>
<div id="s">
  <div><img data-bg src="https://picsum.photos/id/1018/1400/900" alt="Mountains"></div>
  <div><img data-bg src="https://picsum.photos/id/1036/1400/900" alt="Snow"></div>
  <div><img data-bg src="https://picsum.photos/id/1043/1400/900" alt="City"></div>
  <div><img data-bg src="https://picsum.photos/id/1050/1400/900" alt="Sea"></div>
</div>
<script type="module">
const slider = new InsigneSlider('#s', { effect: 'cube', aspect: '16/9' });
  const sel = document.querySelector('#fx');
  for (const name of InsigneSlider.effects) sel.add(new Option(name, name, false, name === 'cube'));
  sel.onchange = () => {
    slider.update({ effect: sel.value });
    slider.next();
  };
</script>
</body>
</html>
