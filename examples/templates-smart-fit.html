<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crop-free portraits · Insigne Slider</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/insigne-slider@1/dist/insigne-slider.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:16px;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#14161c;background:#fff}
body { padding: 24px clamp(14px, 3vw, 32px); background: #f3f1ec; color: #121210; font-family: system-ui, sans-serif; }
  p.note { margin: 0 0 16px; max-width: 640px; color: #57554f; line-height: 1.5; }
  .cap { position: absolute; left: 16px; bottom: 16px; padding: 6px 10px; border-radius: 8px; background: rgba(18,18,16,.65); color: #fff; font: 12px ui-monospace, Menlo, monospace; }
  insigne-slider { --ins-radius: 14px; }
</style>
</head>
<body>
<p class="note">Each portrait has a focal point on the face. Switch the preview to phone width: the frame gets taller and narrower, the faces stay in it.</p>
<insigne-slider effect="fade" autoplay="4500" min-height="320" pagination="dots" arrows="visible">
  <div><img data-bg src="https://picsum.photos/id/1027/1800/1200" alt="Woman with long hair" data-focus="68% 32%"><span class="cap">data-focus="68% 32%"</span></div>
  <div><img data-bg src="https://picsum.photos/id/64/1800/1200" alt="Woman wearing sunglasses" data-focus="66% 36%"><span class="cap">data-focus="66% 36%"</span></div>
  <div><img data-bg src="https://picsum.photos/id/823/1800/1200" alt="Photographer in a red beanie" data-focus="50% 30%"><span class="cap">data-focus="50% 30%"</span></div>
  <div><img data-bg src="https://picsum.photos/id/1005/1800/1200" alt="Man in a hood" data-focus="38% 40%" data-safe="25 15 30 70"><span class="cap">data-safe="25 15 30 70"</span></div>
</insigne-slider>

</body>
</html>
